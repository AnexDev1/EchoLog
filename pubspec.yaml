name: echolog
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_sound: ^9.28.0
  google_fonts: ^6.2.1
  intl: ^0.20.2
  path_provider: ^2.1.5
  permission_handler: ^12.0.0+1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_colorpicker: ^1.1.0
  uuid: ^4.5.1
  emoji_selector: ^0.0.6
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  provider: ^6.1.5
  share_plus: ^11.0.0
  flutter_launcher_icons: ^0.14.4
  http: ^1.4.0
  home_widget: ^0.8.0
  file_picker: ^10.2.0
  archive: ^4.0.7


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  build_runner: ^2.4.15
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true


  assets:
    - assets/icon/
    - assets/gif/
    
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21    